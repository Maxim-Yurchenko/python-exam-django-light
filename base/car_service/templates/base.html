<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Автосервис{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">
        <a href = "{% url 'home' %}" class = "text-decoration-none text-dark">Автосервис</h1>
        
        {% block content %}
        {% endblock %}
        
        <div class="fixed-bottom bg-light p-3 text-center border-top">
            <a href="{% url 'admin:index' %}" class="btn btn-secondary">Админка</a>
            <a href="{% url 'closed_orders' %}" class="btn btn-warning">Закрытые заказы</a>
        </div>
    </div>
    
</body>
</html>
